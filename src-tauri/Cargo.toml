[package]
name = "dynamic-island"
version = "0.2.0"
description = "Dynamic Island for desktop"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dynamic_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = "2"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
# Версия закреплена: сигнатуры обработчиков событий и макроса #[implement]
# отличаются между минорными версиями windows-rs.
# windows-core нужен макросу #[implement] (он ссылается на крейт по имени).
windows-core = "0.58"
windows = { version = "0.58", features = [
  "implement",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Devices_Enumeration",
  "Devices_Bluetooth",
  "Devices_Radios",
  "Networking_Connectivity",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
